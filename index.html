<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ashley 💙</title>
  <meta name="description" content="Una página especial para Ashley, mi princesa">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  
  <!-- Particles.js -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/liquid-waves.css">
</head>
<body>
  <!-- Liquid Waves Background -->
  <div class="liquid-waves">
    <!-- Mesh gradient blobs -->
    <div class="liquid-blob liquid-blob-1"></div>
    <div class="liquid-blob liquid-blob-2"></div>
    <div class="liquid-blob liquid-blob-3"></div>
    <div class="liquid-blob liquid-blob-4"></div>
    
    <!-- Wave layers -->
    <div class="liquid-wave liquid-wave-1"></div>
    <div class="liquid-wave liquid-wave-2"></div>
    <div class="liquid-wave liquid-wave-3"></div>
    
    <!-- Floating particles -->
    <div class="liquid-particles">
      <div class="liquid-particle"></div>
      <div class="liquid-particle"></div>
      <div class="liquid-particle"></div>
      <div class="liquid-particle"></div>
      <div class="liquid-particle"></div>
      <div class="liquid-particle"></div>
      <div class="liquid-particle"></div>
      <div class="liquid-particle"></div>
      <div class="liquid-particle"></div>
      <div class="liquid-particle"></div>
      <div class="liquid-particle"></div>
      <div class="liquid-particle"></div>
      <div class="liquid-particle"></div>
      <div class="liquid-particle"></div>
      <div class="liquid-particle"></div>
    </div>
    
    <!-- Overlays -->
    <div class="liquid-vignette"></div>
    <div class="liquid-noise"></div>
  </div>

  <!-- Particles.js Background (additional layer) -->
  <div id="particles-js"></div>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-brand">Ashley</div>
    <div class="nav-progress">
      <a href="index.html" class="nav-dot active" title="Bienvenida"></a>
      <a href="carta.html" class="nav-dot" title="Carta"></a>
      <a href="historia.html" class="nav-dot" title="Historia"></a>
      <a href="razones.html" class="nav-dot" title="Razones"></a>
      <a href="final.html" class="nav-dot" title="Final"></a>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <!-- Decoración de fondo -->
    <div class="hero-decoration hero-decoration-1"></div>
    <div class="hero-decoration hero-decoration-2"></div>
    <div class="hero-decoration hero-decoration-3"></div>

    <div class="hero-content">
      <h1 class="hero-name">Ashley</h1>
      <p class="hero-subtitle">~ mi princesa ~</p>
      <p class="hero-message">
        Hay personas que llegan a tu vida<br>
        y la cambian para siempre...
      </p>
      <div class="hero-cta">
        <a href="carta.html" class="btn btn-primary">
          Descubrir más
          <span>→</span>
        </a>
      </div>
    </div>

    <!-- Scroll indicator -->
    <div class="hero-scroll">
      <span class="hero-scroll-text">Scroll</span>
      <div class="hero-scroll-arrow"></div>
    </div>
  </section>

  <!-- Page Navigation -->
  <div class="page-nav">
    <span></span>
    <div class="page-nav-center">
      <a href="index.html" class="page-nav-indicator active"></a>
      <a href="carta.html" class="page-nav-indicator"></a>
      <a href="historia.html" class="page-nav-indicator"></a>
      <a href="razones.html" class="page-nav-indicator"></a>
      <a href="final.html" class="page-nav-indicator"></a>
    </div>
    <a href="carta.html" class="page-nav-btn">
      Siguiente <span>→</span>
    </a>
  </div>

  <!-- Scripts -->
  <script src="js/liquid-mesh.js"></script>
  <script src="js/particles-config.js"></script>
  <script src="js/main.js"></script>

</html>
